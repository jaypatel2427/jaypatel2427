<svg width="900" height="40" viewBox="0 0 900 40" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="40" fill="#00000000"/>
  <line x1="0" y1="20" x2="900" y2="20" stroke="#123a24" stroke-width="2"/>
  <line x1="0" y1="20" x2="900" y2="20" stroke="#39ff14" stroke-width="2" stroke-dasharray="40 18">
    <animate attributeName="stroke-dashoffset" values="0;-580" dur="6s" repeatCount="indefinite"/>
  </line>
  <g fill="#ff2b6d" opacity="0.7">
    <rect x="120" y="12" width="26" height="4">
      <animate attributeName="x" values="120;760;300;120" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="500" y="24" width="40" height="3">
      <animate attributeName="x" values="500;80;650;500" dur="4.1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g fill="#00e5ff" opacity="0.7">
    <rect x="700" y="16" width="18" height="4">
      <animate attributeName="x" values="700;200;600;700" dur="2.7s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="450" cy="20" r="4" fill="#39ff14">
    <animate attributeName="r" values="3;6;3" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</svg>
