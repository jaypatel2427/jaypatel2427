<svg width="640" height="90" viewBox="0 0 640 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="revealClip">
      <rect x="0" y="0" height="90" width="0">
        <animate attributeName="width"
          values="0;560;560;0;0"
          keyTimes="0;0.35;0.55;0.58;1"
          dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="640" height="90" fill="#00000000"/>

  <g clip-path="url(#revealClip)">
    <text x="10" y="35" font-family="Courier New, monospace" font-size="24" fill="#39ff14">
      &gt; Cybersecurity Enthusiast | Kali Linux
    </text>
    <text x="10" y="68" font-family="Courier New, monospace" font-size="24" fill="#39ff14">
      &gt; Learning to break things, then fix them
    </text>
  </g>

  <rect x="0" y="10" width="12" height="26" fill="#39ff14">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.35;0.4;0.95;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x" values="0;560;560;0;0" keyTimes="0;0.35;0.55;0.58;1" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
